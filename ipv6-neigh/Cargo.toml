[package]
name = "ipv6-neigh"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
rtnetlink = { version = "0.24.0" }
netlink-sys = { version = "0.9" }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util"] }
futures = "0.3.34"
netlink-packet-route = { version = "0.34" }
netlink-packet-core = { version = "0.9" }
clap = { version = "4.6.7", default-features = false, features = ["cargo", "derive", "help", "std", "suggestions"] }
hickory-proto = { git = "https://github.com/hickory-dns/hickory-dns.git", rev = "78d11a133237eb5e00cf137584337c14177dabd7", features = ["dnssec-ring"] }
ubus = "0.1.7"
serde_json = "1.0.154"
log = "0.4.35"
env_logger = "0.11.11"
anyhow = "1.0.104"
socket2 = { version = "0.6.5", features = ["all"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
overflow-checks = false
panic = "abort"
